spring.application.name=Customer_Complaint
server.port=${PORT:8080}

# --- .env ---
# Loads a plain KEY=VALUE `.env` file (Properties syntax — no quotes, no
# `export`) from the project root as if it were a .properties file; the
# [.properties] suffix is a Spring Boot config-data extension hint, it does
# not need to match the real filename. `optional:` means the app still
# starts if the file is missing, but every ${VAR} placeholder below then
# fails to resolve unless it's set some other way (a real OS/CI env var).
# .env is git-ignored on purpose — see .env.example for the variables it
# needs to define. Every branch/clone needs its own copy.
spring.config.import=optional:file:.env[.properties]

# --- Database ---
# MySQL creates the schema on first connect if it's missing
#createDatabaseIfNotExist=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/camtel_complaint?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
#spring.datasource.url=jdbc:mysql://localhost:3306/camtel_complaint?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = create/alter tables to match entities, without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- JWT ---
# secret must be at least 256 bits (32+ chars) for HS256
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# --- CORS ---
# comma-separated list of allowed origin patterns for the frontend; see
# CorsConfig. Defaults to the local/LAN dev origins so local dev is
# unaffected when this isn't set.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4173,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*}

# --- SMS gateway (feign client base url) ---
sms.gateway.base-url=https://api.your-sms-provider.com


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Shown as the "From" address on outgoing mail - keep it the same as
# spring.mail.username above, most SMTP relays (Gmail included) reject a
# From that doesn't match the authenticated account.
app.mail.from=${MAIL_USERNAME}

# --- Report storage ---
# folder (relative to the app's working directory, or an absolute path)
# where generated PDF reports are written
report.storage-dir=reports

# --- Captcha (hCaptcha/reCAPTCHA) ---
captcha.secret-key=${CAPTCHA_SECRET_KEY}
captcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# --- Actuator ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# --- Springdoc / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ---
logging.level.customer_complaint.customer_complaint=DEBUG
logging.level.org.springframework.security=INFO