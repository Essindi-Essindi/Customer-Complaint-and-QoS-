spring.application.name=Customer_Complaint
server.port=8080

# --- Database ---
# MySQL creates the schema on first connect if it's missing
#createDatabaseIfNotExist=true

spring.datasource.url=jdbc:mysql://localhost:3306/camtel_complaint?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#spring.datasource.url=jdbc:mysql://localhost:3306/camtel_complaint?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = create/alter tables to match entities, without dropping existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- RabbitMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- JWT ---
# secret must be at least 256 bits (32+ chars) for HS256
jwt.secret=change-this-to-a-long-random-secret-at-least-32-characters
jwt.expiration-ms=86400000

# --- SMS gateway (feign client base url) ---
sms.gateway.base-url=https://api.your-sms-provider.com

# --- Captcha (hCaptcha/reCAPTCHA) ---
captcha.secret-key=your-captcha-secret-key
captcha.verify-url=https://hcaptcha.com/siteverify

# --- Actuator ---
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

# --- Springdoc / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Logging ---
logging.level.customer_complaint.customer_complaint=DEBUG
logging.level.org.springframework.security=INFO



#report
report.storage-dir=reports